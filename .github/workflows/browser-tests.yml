# CC-194: unit tests plus the browser and accessibility suites on every pull request to main.
# GitHub's runners can install Chromium; the Claude build environment can't.
# CC-198: every outside action is pinned to a full commit SHA (its release in the comment),
# checkout keeps no token, and only pull-request runs cancel an older run of the same branch.
name: Browser tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  # A newer push to a pull request replaces its older run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.49.1
          python -m playwright install --with-deps chromium

      - name: Serve the production build
        id: serve
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: End-to-end scenarios (e2e.py)
        run: python tests/e2e/e2e.py

      - name: Family chat and evening recap (everyday.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/everyday.py

      - name: Accessibility audit (a11y.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/a11y.py

      - name: Preview server log
        if: failure()
        run: cat preview.log || true

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-screenshots
          path: tests/e2e/out/
          retention-days: 7
          if-no-files-found: ignore
