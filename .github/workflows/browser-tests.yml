# CC-194: unit tests plus the browser and accessibility suites on every pull request to main.
# GitHub's runners can install Chromium; the Claude build environment can't.
# CC-198: every outside action is pinned to a full commit SHA (its release in the comment),
# checkout keeps no token, and only pull-request runs cancel an older run of the same branch.
name: Browser tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces its older run. Every other run (main, on demand)
  # gets a group of its own, so it is never cancelled or dropped while waiting.
  group: browser-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.49.1
          python -m playwright install --with-deps chromium

      - name: Serve the production build
        id: serve
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: End-to-end scenarios (e2e.py)
        run: python tests/e2e/e2e.py

      - name: Family chat and evening recap (everyday.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/everyday.py

      - name: Calm alerts (calm.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/calm.py

      - name: Help board (help.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/help.py

      - name: Ask for a hand, Coming Home, visit questions (sprint17.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/sprint17.py

      - name: After-visit notes and next steps (sprint18.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/sprint18.py

      - name: Call log and What matters to me (sprint19.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/sprint19.py

      - name: Away mode (sprint20.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/sprint20.py

      - name: Sign-in recovery for a lost phone (sprint21.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/sprint21.py

      - name: Confident at home (sprint22.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/sprint22.py

      - name: POC quick wins (sprint25.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/sprint25.py

      - name: Safer Doses (sprint26.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/sprint26.py

      - name: Accessibility audit (a11y.py)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: python tests/e2e/a11y.py

      - name: Preview server log
        if: failure()
        run: cat preview.log || true

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-screenshots
          path: tests/e2e/out/
          retention-days: 7
          if-no-files-found: ignore
